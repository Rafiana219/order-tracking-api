services:
  postgres:
    image: postgres:16
    container_name: order-tracking-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: order_tracking
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_tracking"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: